<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas RAG 챗봇</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --canvas: #E66000;
      --canvas-dark: #C45300;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #dde1e7;
      --text: #1a1a1a;
      --text-muted: #6b7280;
      --user-bg: #E66000;
      --user-text: #ffffff;
      --bot-bg: #ffffff;
      --bot-border: #dde1e7;
      --source-bg: #fff7f0;
      --source-border: #f5d8c0;
      --radius: 12px;
      --radius-sm: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--canvas);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
      flex-shrink: 0;
    }
    header .logo {
      width: 32px; height: 32px;
      background: #fff;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: var(--canvas);
    }
    header h1 { font-size: 17px; font-weight: 600; }
    header .subtitle { font-size: 12px; opacity: .8; margin-top: 1px; }
    header .session-badge {
      margin-left: auto;
      font-size: 11px;
      background: rgba(255,255,255,.2);
      padding: 3px 8px;
      border-radius: 20px;
      opacity: .85;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Controls bar */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .controls label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
    .controls select {
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      background: var(--bg);
      cursor: pointer;
      outline: none;
    }
    .controls select:focus { border-color: var(--canvas); }
    .btn-reset {
      margin-left: auto;
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      color: var(--text-muted);
    }
    .btn-reset:hover { border-color: var(--canvas); color: var(--canvas); }

    /* Chat window */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; gap: 10px; max-width: 780px; width: 100%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .msg.user .avatar { background: var(--canvas); color: #fff; }
    .msg.bot  .avatar { background: #e8eaf0; color: #555; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      max-width: calc(100% - 44px);
    }
    .msg.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--bot-border);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    /* Sources */
    .sources {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--source-bg);
      border: 1px solid var(--source-border);
      border-radius: var(--radius-sm);
      font-size: 12px;
    }
    .sources .src-title {
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: 11px;
    }
    .sources a {
      display: block;
      color: var(--canvas-dark);
      text-decoration: none;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sources a:hover { text-decoration: underline; }
    .sources .score {
      display: inline-block;
      background: #fde8d5;
      color: var(--canvas-dark);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* Loading */
    .loading-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--canvas);
      margin: 0 2px;
      animation: bounce 1.1s infinite ease-in-out;
    }
    .loading-dots span:nth-child(2) { animation-delay: .18s; }
    .loading-dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(.6); opacity: .4; }
      40%           { transform: scale(1);  opacity: 1;  }
    }

    /* Answer formatting */
    .bubble p  { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ol, .bubble ul { padding-left: 20px; margin-bottom: 8px; }
    .bubble li { margin-bottom: 4px; }
    .bubble strong { font-weight: 600; }

    /* Input area */
    .input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    #query {
      flex: 1;
      font-size: 14px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      font-family: inherit;
    }
    #query:focus { border-color: var(--canvas); }
    #send {
      background: var(--canvas);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    #send:hover { background: var(--canvas-dark); }
    #send:disabled { opacity: .5; cursor: not-allowed; }

    /* Welcome message */
    .welcome {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
      max-width: 480px;
      margin: auto;
    }
    .welcome .icon { font-size: 48px; margin-bottom: 12px; }
    .welcome h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .welcome p { font-size: 13px; line-height: 1.6; }
    .welcome .examples {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .example-btn {
      font-size: 13px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: left;
      color: var(--text);
      transition: border-color .15s;
    }
    .example-btn:hover { border-color: var(--canvas); color: var(--canvas); }

    @media (max-width: 600px) {
      header h1 { font-size: 15px; }
      .bubble { font-size: 13px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">C</div>
  <div>
    <h1>Canvas RAG 챗봇</h1>
    <div class="subtitle">Canvas LMS 공식 문서 기반 AI 답변</div>
  </div>
  <div class="session-badge" id="session-badge">새 대화</div>
</header>

<div class="controls">
  <label for="role">역할</label>
  <select id="role">
    <option value="">전체</option>
    <option value="student">학생 (Student)</option>
    <option value="instructor">교수자 (Instructor)</option>
    <option value="admin">관리자 (Admin)</option>
  </select>
  <button class="btn-reset" id="btn-reset">대화 초기화</button>
</div>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="icon">📚</div>
    <h2>Canvas 가이드 AI 챗봇</h2>
    <p>Canvas LMS 공식 문서를 기반으로 한국어로 답변합니다.<br>출처 URL이 함께 제공됩니다.</p>
    <div class="examples">
      <button class="example-btn" onclick="fillQuery(this)">Canvas에서 assignment를 어떻게 제출하나요?</button>
      <button class="example-btn" onclick="fillQuery(this)">due date와 availability date 차이가 뭔가요?</button>
      <button class="example-btn" onclick="fillQuery(this)">SpeedGrader 사용 방법을 알려주세요.</button>
      <button class="example-btn" onclick="fillQuery(this)">Canvas Gradebook에서 성적을 입력하는 방법은?</button>
    </div>
  </div>
</div>

<div class="input-area">
  <textarea id="query" placeholder="Canvas 관련 질문을 입력하세요..." rows="1"></textarea>
  <button id="send" onclick="sendMessage()">전송</button>
</div>

<script>
  let sessionId = null;

  const messagesEl = document.getElementById('messages');
  const queryEl    = document.getElementById('query');
  const sendBtn    = document.getElementById('send');
  const badgeEl    = document.getElementById('session-badge');
  const welcomeEl  = document.getElementById('welcome');

  function fillQuery(btn) {
    queryEl.value = btn.textContent.trim();
    queryEl.focus();
  }

  function hideWelcome() {
    if (welcomeEl) welcomeEl.remove();
  }

  function appendUserMsg(text) {
    hideWelcome();
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `
      <div class="avatar">나</div>
      <div class="bubble">${escHtml(text)}</div>`;
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function appendBotMsg(answer, sources) {
    const div = document.createElement('div');
    div.className = 'msg bot';
    const formatted = formatAnswer(answer);
    let sourcesHtml = '';
    if (sources && sources.length > 0) {
      const links = sources.map(s => {
        const title = escHtml(s.title || s.source_url);
        const score = s.score ? `<span class="score">${(s.score * 100).toFixed(0)}%</span>` : '';
        return `<a href="${escHtml(s.source_url)}" target="_blank" rel="noopener">${title}${score}</a>`;
      }).join('');
      sourcesHtml = `<div class="sources"><div class="src-title">참고 문서</div>${links}</div>`;
    }
    div.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble">${formatted}${sourcesHtml}</div>`;
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function appendLoading() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'loading-msg';
    div.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble">
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>`;
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function removeLoading() {
    document.getElementById('loading-msg')?.remove();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatAnswer(text) {
    // minimal markdown: bold, newlines → paragraphs
    let html = escHtml(text);
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // numbered lists
    html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<li>$2</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ol>${m}</ol>`);
    // paragraphs
    html = html.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
    return html;
  }

  async function sendMessage() {
    const query = queryEl.value.trim();
    if (!query) return;

    const role = document.getElementById('role').value || null;
    queryEl.value = '';
    autoResize();
    sendBtn.disabled = true;

    appendUserMsg(query);
    const loading = appendLoading();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ query, role, session_id: sessionId, top_k: 5 })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      sessionId = data.session_id;
      badgeEl.textContent = '세션 ' + (sessionId ? sessionId.slice(0, 8) + '…' : '활성');

      removeLoading();
      appendBotMsg(data.answer, data.sources);
    } catch (e) {
      removeLoading();
      appendBotMsg(`오류가 발생했습니다: ${e.message}`, []);
    } finally {
      sendBtn.disabled = false;
      queryEl.focus();
    }
  }

  async function resetSession() {
    if (!sessionId) { location.reload(); return; }
    try {
      await fetch(`/chat/session/${sessionId}`, { method: 'DELETE' });
    } catch {}
    sessionId = null;
    badgeEl.textContent = '새 대화';
    messagesEl.innerHTML = '';
    messagesEl.insertAdjacentHTML('afterbegin', `
      <div class="welcome" id="welcome">
        <div class="icon">📚</div>
        <h2>Canvas 가이드 AI 챗봇</h2>
        <p>Canvas LMS 공식 문서를 기반으로 한국어로 답변합니다.<br>출처 URL이 함께 제공됩니다.</p>
        <div class="examples">
          <button class="example-btn" onclick="fillQuery(this)">Canvas에서 assignment를 어떻게 제출하나요?</button>
          <button class="example-btn" onclick="fillQuery(this)">due date와 availability date 차이가 뭔가요?</button>
          <button class="example-btn" onclick="fillQuery(this)">SpeedGrader 사용 방법을 알려주세요.</button>
          <button class="example-btn" onclick="fillQuery(this)">Canvas Gradebook에서 성적을 입력하는 방법은?</button>
        </div>
      </div>`);
  }

  document.getElementById('btn-reset').addEventListener('click', resetSession);

  // Enter to send (Shift+Enter for newline)
  queryEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  function autoResize() {
    queryEl.style.height = 'auto';
    queryEl.style.height = Math.min(queryEl.scrollHeight, 120) + 'px';
  }
  queryEl.addEventListener('input', autoResize);
</script>

</body>
</html>
