<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas RAG 챗봇</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --canvas: #E66000;
      --canvas-dark: #C45300;
      --sb-bg: #202123;
      --sb-hover: #2a2b32;
      --sb-active: #343541;
      --sb-text: #ececec;
      --sb-muted: #8e8ea0;
      --main-bg: #ffffff;
      --border: #e5e7eb;
      --text: #1a1a1a;
      --text-muted: #6b7280;
      --bot-bg: #f9fafb;
      --src-bg: #fff7f0;
      --src-border: #f5d8c0;
      --radius: 12px;
      --radius-sm: 6px;
      --sb-w: 256px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--main-bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ──────────────── Sidebar ──────────────── */
    #sidebar {
      width: var(--sb-w);
      min-width: var(--sb-w);
      background: var(--sb-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .2s, min-width .2s;
      flex-shrink: 0;
    }
    #sidebar.collapsed { width: 0; min-width: 0; }

    .sb-top {
      padding: 10px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      flex-shrink: 0;
    }
    .sb-logo {
      width: 30px; height: 30px; background: var(--canvas);
      border-radius: 7px; display: flex; align-items: center;
      justify-content: center; font-weight: 800; font-size: 14px;
      color: #fff; flex-shrink: 0;
    }
    .btn-new {
      flex: 1; background: transparent;
      border: 1px solid rgba(255,255,255,.2);
      color: var(--sb-text); padding: 7px 10px;
      border-radius: 7px; font-size: 13px;
      cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap; overflow: hidden;
    }
    .btn-new:hover { background: var(--sb-hover); }
    .btn-new svg { flex-shrink: 0; }

    .sb-list {
      flex: 1; overflow-y: auto; padding: 6px 6px 0;
    }
    .sb-list::-webkit-scrollbar { width: 3px; }
    .sb-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }

    .sb-group-label {
      font-size: 11px; color: var(--sb-muted);
      padding: 10px 8px 3px;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .sb-item {
      display: flex; align-items: center;
      padding: 7px 8px; border-radius: 7px;
      cursor: pointer; gap: 6px;
      color: var(--sb-text); position: relative;
      margin-bottom: 1px;
    }
    .sb-item:hover { background: var(--sb-hover); }
    .sb-item.active { background: var(--sb-active); }
    .sb-item-title {
      flex: 1; font-size: 13px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sb-item-meta { font-size: 11px; color: var(--sb-muted); flex-shrink: 0; }
    .btn-del {
      display: none; background: transparent; border: none;
      color: var(--sb-muted); cursor: pointer;
      font-size: 14px; padding: 2px 4px; border-radius: 4px; flex-shrink: 0;
    }
    .sb-item:hover .btn-del { display: block; }
    .btn-del:hover { color: #ef4444; background: rgba(239,68,68,.15); }

    .sb-empty {
      padding: 20px 10px; text-align: center;
      font-size: 12px; color: var(--sb-muted);
    }

    .sb-footer {
      padding: 8px 8px 10px;
      border-top: 1px solid rgba(255,255,255,.07);
      flex-shrink: 0;
    }
    .sb-footer label { font-size: 11px; color: var(--sb-muted); display: block; margin-bottom: 4px; }
    .sb-footer select {
      width: 100%; font-size: 12px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--sb-text); border-radius: 6px;
      padding: 5px 8px; cursor: pointer; outline: none;
    }
    .sb-footer select option { background: #2a2b32; }
    .sb-footer select:focus { border-color: var(--canvas); }

    /* ──────────────── Main ──────────────── */
    #main {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      background: var(--main-bg);
    }

    #main-header {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 10px 14px; display: flex; align-items: center;
      gap: 10px; flex-shrink: 0;
    }
    .btn-toggle {
      background: transparent; border: none; cursor: pointer;
      font-size: 17px; color: var(--text-muted);
      padding: 4px 6px; border-radius: 6px; line-height: 1;
    }
    .btn-toggle:hover { background: #f3f4f6; color: var(--text); }
    #chat-title {
      flex: 1; font-size: 15px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ──────────────── Messages ──────────────── */
    #messages {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 20px 16px; display: flex;
      flex-direction: column; gap: 14px;
    }

    .msg { display: flex; gap: 10px; width: 100%; }
    .msg.user { justify-content: flex-end; }
    .msg.bot  { justify-content: flex-start; }

    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
    }
    .msg.user .avatar { background: var(--canvas); color: #fff; order: 2; }
    .msg.bot  .avatar { background: #e8eaf0; color: #555; }

    .msg-body { max-width: min(640px, calc(100% - 42px)); display: flex; flex-direction: column; gap: 4px; }

    .domain-badge {
      align-self: flex-start; font-size: 10px;
      padding: 2px 7px; border-radius: 10px;
      font-weight: 600; letter-spacing: .03em;
    }
    .domain-badge.canvas  { background: #fff3e8; color: #c45300; border: 1px solid #f5d8c0; }
    .domain-badge.web     { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .domain-badge.casual  { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .domain-badge.general { background: #f5f5f5; color: #555;    border: 1px solid #ddd; }

    .bubble {
      padding: 10px 14px; border-radius: var(--radius);
      font-size: 14px; line-height: 1.65;
      overflow-x: auto; word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--canvas); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: var(--bot-bg); border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Sources */
    .sources {
      padding: 8px 10px; background: var(--src-bg);
      border: 1px solid var(--src-border); border-radius: var(--radius-sm);
      font-size: 12px; margin-top: 8px;
    }
    .src-title {
      font-weight: 600; color: var(--text-muted);
      margin-bottom: 5px; font-size: 10px;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .sources a {
      display: block; color: var(--canvas-dark); text-decoration: none;
      margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sources a:hover { text-decoration: underline; }
    .score-chip {
      display: inline-block; background: #fde8d5; color: var(--canvas-dark);
      font-size: 10px; padding: 1px 5px; border-radius: 10px;
      margin-left: 4px; vertical-align: middle;
    }
    .web-chip {
      display: inline-block; background: #dbeafe; color: #1d4ed8;
      font-size: 10px; padding: 1px 5px; border-radius: 10px;
      margin-left: 4px; vertical-align: middle;
    }

    /* Loading */
    .loading-dots span {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: var(--canvas);
      margin: 0 2px; animation: bounce 1.1s infinite ease-in-out;
    }
    .loading-dots span:nth-child(2) { animation-delay: .18s; }
    .loading-dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(.6); opacity: .4; }
      40%           { transform: scale(1);  opacity: 1; }
    }

    .progress-status { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .source-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .source-chip {
      font-size: 11px; padding: 2px 8px;
      background: var(--src-bg); border: 1px solid var(--src-border);
      border-radius: 12px; color: var(--canvas-dark);
      max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .source-chip.web { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }

    /* Markdown */
    .bubble p  { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ol, .bubble ul { padding-left: 20px; margin-bottom: 8px; }
    .bubble li { margin-bottom: 3px; }
    .bubble strong { font-weight: 600; }
    .bubble h2 { font-size: 15px; font-weight: 700; margin: 12px 0 6px; }
    .bubble h3 { font-size: 14px; font-weight: 600; margin: 10px 0 4px; }
    .stream-raw { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 14px; }
    .bubble code { background: #f1f3f4; padding: 1px 5px; border-radius: 4px; font-family: monospace; font-size: 13px; }
    .bubble .md-table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 10px 0; overflow-x: auto; display: block; }
    .bubble .md-table th, .bubble .md-table td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; white-space: pre-wrap; word-break: break-word; }
    .bubble .md-table th { background: #f9fafb; font-weight: 600; white-space: nowrap; }
    .bubble .md-table tr:nth-child(even) td { background: #fafbfc; }

    /* Welcome */
    .welcome { text-align: center; color: var(--text-muted); padding: 40px 20px; max-width: 440px; margin: auto; }
    .welcome .icon { font-size: 44px; margin-bottom: 12px; }
    .welcome h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .welcome p { font-size: 13px; line-height: 1.6; }
    .welcome .examples { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
    .example-btn { font-size: 13px; padding: 8px 14px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; text-align: left; color: var(--text); transition: border-color .15s; }
    .example-btn:hover { border-color: var(--canvas); color: var(--canvas); }

    /* Input */
    .input-outer { background: #fff; border-top: 1px solid var(--border); padding: 10px 14px; flex-shrink: 0; }
    .input-inner { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; }
    #query { flex: 1; font-size: 14px; padding: 9px 13px; border: 1px solid var(--border); border-radius: var(--radius); outline: none; resize: none; line-height: 1.5; max-height: 120px; overflow-y: auto; font-family: inherit; }
    #query:focus { border-color: var(--canvas); }
    #send { background: var(--canvas); color: #fff; border: none; border-radius: var(--radius); padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s; }
    #send:hover { background: var(--canvas-dark); }
    #send:disabled { opacity: .5; cursor: not-allowed; }

    /* Mobile overlay */
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 99; }

    @media (max-width: 640px) {
      #sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transform: translateX(-100%); transition: transform .25s; width: var(--sb-w) !important; min-width: var(--sb-w) !important; }
      #sidebar.open { transform: translateX(0); }
      #overlay.show { display: block; }
      .bubble { font-size: 13px; }
    }
  </style>
</head>
<body>

<div id="overlay"></div>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sb-top">
    <div class="sb-logo">C</div>
    <button class="btn-new" id="btn-new">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      새 대화
    </button>
  </div>

  <div class="sb-list" id="sb-list">
    <div class="sb-empty">대화 내역이 없습니다</div>
  </div>

  <div class="sb-footer">
    <label for="role">역할 필터</label>
    <select id="role">
      <option value="">전체</option>
      <option value="student">학생 (Student)</option>
      <option value="instructor">교수자 (Instructor)</option>
      <option value="admin">관리자 (Admin)</option>
    </select>
  </div>
</aside>

<!-- Main -->
<div id="main">
  <div id="main-header">
    <button class="btn-toggle" id="btn-toggle" title="사이드바">&#9776;</button>
    <h1 id="chat-title">새 대화</h1>
  </div>

  <div id="messages">
    <div class="welcome" id="welcome">
      <div class="icon">&#128218;</div>
      <h2>Canvas 가이드 AI 챗봇</h2>
      <p>Canvas LMS 공식 문서 기반 답변 · 웹 검색 · 일상 대화를 모두 지원합니다.</p>
      <div class="examples">
        <button class="example-btn" onclick="fillQuery(this)">Canvas에서 assignment를 어떻게 제출하나요?</button>
        <button class="example-btn" onclick="fillQuery(this)">due date와 availability date 차이가 뭔가요?</button>
        <button class="example-btn" onclick="fillQuery(this)">SpeedGrader 사용 방법을 알려주세요.</button>
        <button class="example-btn" onclick="fillQuery(this)">Python 리스트 정렬하는 방법은?</button>
      </div>
    </div>
  </div>

  <div class="input-outer">
    <div class="input-inner">
      <textarea id="query" placeholder="질문을 입력하세요... (Shift+Enter 줄바꿈)" rows="1"></textarea>
      <button id="send" onclick="sendMessage()">전송</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// State
// ══════════════════════════════════════════════
let currentSessionId = localStorage.getItem('canvas-rag-session') || null;
let sidebarSessions = [];

const messagesEl  = document.getElementById('messages');
const queryEl     = document.getElementById('query');
const sendBtn     = document.getElementById('send');
const titleEl     = document.getElementById('chat-title');
const sbListEl    = document.getElementById('sb-list');
const sidebarEl   = document.getElementById('sidebar');
const overlayEl   = document.getElementById('overlay');

// ══════════════════════════════════════════════
// API helpers
// ══════════════════════════════════════════════
async function apiGet(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function refreshSessions() {
  try {
    sidebarSessions = await apiGet('/chat/sessions');
  } catch {
    sidebarSessions = [];
  }
  renderSidebar();
}

// ══════════════════════════════════════════════
// Sidebar rendering
// ══════════════════════════════════════════════
function relativeTime(ts) {
  const now = Date.now() / 1000;
  const diff = now - ts;
  if (diff < 3600)   return `${Math.max(1, Math.floor(diff / 60))}분 전`;
  if (diff < 86400)  return `${Math.floor(diff / 3600)}시간 전`;
  if (diff < 172800) return '어제';
  const d = new Date(ts * 1000);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function groupSessions(sessions) {
  const now = Date.now() / 1000;
  const groups = { '오늘': [], '어제': [], '이번 주': [], '이전': [] };
  for (const s of sessions) {
    const diff = now - s.updated_at;
    if (diff < 86400)       groups['오늘'].push(s);
    else if (diff < 172800) groups['어제'].push(s);
    else if (diff < 604800) groups['이번 주'].push(s);
    else                    groups['이전'].push(s);
  }
  return groups;
}

function renderSidebar() {
  if (!sidebarSessions.length) {
    sbListEl.innerHTML = '<div class="sb-empty">대화 내역이 없습니다</div>';
    return;
  }
  const groups = groupSessions(sidebarSessions);
  let html = '';
  for (const [label, items] of Object.entries(groups)) {
    if (!items.length) continue;
    html += `<div class="sb-group-label">${label}</div>`;
    for (const s of items) {
      const active = s.id === currentSessionId ? ' active' : '';
      const title = escHtml(s.title || '(제목 없음)');
      const meta = relativeTime(s.updated_at);
      html += `
        <div class="sb-item${active}" data-id="${s.id}" onclick="selectSession('${s.id}')">
          <span class="sb-item-title" title="${title}">${title}</span>
          <span class="sb-item-meta">${meta}</span>
          <button class="btn-del" title="삭제" onclick="deleteSession(event,'${s.id}')">&#10005;</button>
        </div>`;
    }
  }
  sbListEl.innerHTML = html;
}

// ══════════════════════════════════════════════
// Session management
// ══════════════════════════════════════════════
async function selectSession(id) {
  if (id === currentSessionId) { closeMobileSidebar(); return; }
  currentSessionId = id;
  localStorage.setItem('canvas-rag-session', id);
  closeMobileSidebar();
  renderSidebar();

  messagesEl.innerHTML = '<div class="msg bot"><div class="avatar">AI</div><div class="msg-body"><div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div></div></div>';

  try {
    const data = await apiGet(`/chat/session/${id}/history`);
    titleEl.textContent = data.title || '대화';
    messagesEl.innerHTML = '';
    for (const t of data.turns || []) {
      if (t.role === 'user') appendUserBubble(t.content, false);
      else                   appendBotBubble(t.content, [], null, false);
    }
    scrollBottom();
  } catch {
    showWelcome();
    currentSessionId = null;
    localStorage.removeItem('canvas-rag-session');
  }
}

async function deleteSession(e, id) {
  e.stopPropagation();
  try { await fetch(`/chat/session/${id}`, { method: 'DELETE' }); } catch {}
  if (id === currentSessionId) {
    currentSessionId = null;
    localStorage.removeItem('canvas-rag-session');
    titleEl.textContent = '새 대화';
    showWelcome();
  }
  await refreshSessions();
}

function startNewChat() {
  currentSessionId = null;
  localStorage.removeItem('canvas-rag-session');
  titleEl.textContent = '새 대화';
  showWelcome();
  renderSidebar();
  closeMobileSidebar();
  queryEl.focus();
}

// ══════════════════════════════════════════════
// Message rendering
// ══════════════════════════════════════════════
function showWelcome() {
  messagesEl.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="icon">&#128218;</div>
      <h2>Canvas 가이드 AI 챗봇</h2>
      <p>Canvas LMS 공식 문서 기반 답변 · 웹 검색 · 일상 대화를 모두 지원합니다.</p>
      <div class="examples">
        <button class="example-btn" onclick="fillQuery(this)">Canvas에서 assignment를 어떻게 제출하나요?</button>
        <button class="example-btn" onclick="fillQuery(this)">due date와 availability date 차이가 뭔가요?</button>
        <button class="example-btn" onclick="fillQuery(this)">SpeedGrader 사용 방법을 알려주세요.</button>
        <button class="example-btn" onclick="fillQuery(this)">Python 리스트 정렬하는 방법은?</button>
      </div>
    </div>`;
}

function appendUserBubble(text, scroll = true) {
  document.getElementById('welcome')?.remove();
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="avatar">나</div><div class="msg-body"><div class="bubble">${escHtml(text)}</div></div>`;
  messagesEl.appendChild(div);
  if (scroll) scrollBottom();
}

function domainLabel(domain) {
  const map = { canvas: 'Canvas RAG', web: '웹 검색', casual: '일상 대화', general: '일반' };
  return map[domain] || domain;
}

function appendBotBubble(answer, sources, domain, scroll = true) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  const badgeHtml = domain
    ? `<span class="domain-badge ${domain}">${domainLabel(domain)}</span>`
    : '';
  let sourcesHtml = '';
  if (sources && sources.length) {
    const links = sources.map(s => {
      const title = escHtml(s.title || s.source_url);
      const badge = s.source_type === 'web'
        ? `<span class="web-chip">웹</span>`
        : (s.score ? `<span class="score-chip">${(s.score*100).toFixed(0)}%</span>` : '');
      return `<a href="${escHtml(s.source_url)}" target="_blank" rel="noopener">${title}${badge}</a>`;
    }).join('');
    sourcesHtml = `<div class="sources"><div class="src-title">참고 출처</div>${links}</div>`;
  }
  div.innerHTML = `
    <div class="avatar">AI</div>
    <div class="msg-body">
      ${badgeHtml}
      <div class="bubble">${formatAnswer(answer)}</div>
      ${sourcesHtml}
    </div>`;
  messagesEl.appendChild(div);
  if (scroll) scrollBottom();
}

// ══════════════════════════════════════════════
// Send message (SSE streaming)
// ══════════════════════════════════════════════
async function sendMessage() {
  const query = queryEl.value.trim();
  if (!query) return;
  const role = document.getElementById('role').value || null;

  queryEl.value = '';
  autoResize();
  sendBtn.disabled = true;
  appendUserBubble(query);

  // Loading bubble
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg bot';
  loadingDiv.innerHTML = `
    <div class="avatar">AI</div>
    <div class="msg-body">
      <div class="bubble">
        <div class="progress-status">질문을 분석하고 있습니다...</div>
        <div class="source-chips"></div>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>`;
  messagesEl.appendChild(loadingDiv);
  scrollBottom();

  const bubbleEl   = loadingDiv.querySelector('.bubble');
  const progressEl = loadingDiv.querySelector('.progress-status');
  const chipsEl    = loadingDiv.querySelector('.source-chips');
  let streamRawEl  = null;
  let answerText   = '';
  let streamingStarted = false;
  let responseDomain = null;

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 900_000);

  const WAIT_MSGS = [
    '답변 생성 중입니다. 조금만 기다려 주세요...',
    '예상보다 조금 오래 걸리고 있습니다...',
    '복잡한 질문입니다. 거의 다 됐습니다...',
    '잠시만 더 기다려 주세요...',
  ];

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, role, session_id: currentSessionId, top_k: 15 }),
      signal: controller.signal,
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const detail = typeof err.detail === 'string' ? err.detail : `HTTP ${res.status}`;
      throw new Error(detail);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let waitTimer = null;
    let waitIdx = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch { continue; }

        if (ev.type === 'status') {
          if (progressEl) progressEl.textContent = ev.message;
          if (ev.message.includes('생성하고')) {
            waitTimer = setInterval(() => {
              if (progressEl && waitIdx < WAIT_MSGS.length)
                progressEl.textContent = WAIT_MSGS[waitIdx++];
            }, 15000);
          }

        } else if (ev.type === 'source_found') {
          const chip = document.createElement('span');
          chip.className = 'source-chip' + (ev.source_type === 'web' ? ' web' : '');
          chip.title = ev.title || ev.url;
          chip.textContent = ev.title || ev.url;
          chipsEl?.appendChild(chip);
          scrollBottom();

        } else if (ev.type === 'token') {
          if (!streamingStarted) {
            if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
            if (bubbleEl) {
              bubbleEl.innerHTML = '<div class="stream-raw"></div>';
              streamRawEl = bubbleEl.querySelector('.stream-raw');
            }
            streamingStarted = true;
          }
          answerText += ev.content;
          if (streamRawEl) {
            streamRawEl.insertAdjacentText('beforeend', ev.content.replace(/<br\s*\/?>/gi, '\n'));
            scrollBottom();
          }

        } else if (ev.type === 'done') {
          clearTimeout(timeout);
          if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }

          // Update session
          if (ev.session_id) {
            const isNew = !currentSessionId;
            currentSessionId = ev.session_id;
            localStorage.setItem('canvas-rag-session', currentSessionId);
            if (isNew) await refreshSessions();
            else renderSidebar();
          }
          responseDomain = ev.domain;

          const finalAnswer = stripLLMSources(answerText || ev.answer || '');
          const finalSources = ev.sources || [];

          if (bubbleEl) {
            const badgeHtml = responseDomain
              ? `<span class="domain-badge ${responseDomain}">${domainLabel(responseDomain)}</span>`
              : '';
            let sourcesHtml = '';
            if (finalSources.length) {
              const links = finalSources.map(s => {
                const title = escHtml(s.title || s.source_url);
                const badge = s.source_type === 'web'
                  ? `<span class="web-chip">웹</span>`
                  : (s.score ? `<span class="score-chip">${(s.score*100).toFixed(0)}%</span>` : '');
                return `<a href="${escHtml(s.source_url)}" target="_blank" rel="noopener">${title}${badge}</a>`;
              }).join('');
              sourcesHtml = `<div class="sources"><div class="src-title">참고 출처</div>${links}</div>`;
            }

            // Rebuild: insert badge outside bubble, answer inside
            const msgBody = loadingDiv.querySelector('.msg-body');
            if (msgBody) {
              try {
                msgBody.innerHTML = `${badgeHtml}<div class="bubble">${formatAnswer(finalAnswer)}</div>${sourcesHtml}`;
              } catch {
                msgBody.innerHTML = `${badgeHtml}<div class="bubble"><pre style="white-space:pre-wrap">${escHtml(finalAnswer)}</pre></div>${sourcesHtml}`;
              }
            }

            // Update title on first message
            if (titleEl.textContent === '새 대화') {
              titleEl.textContent = query.slice(0, 30) + (query.length > 30 ? '…' : '');
            }
            scrollBottom();
          }
        }
      }
    }

  } catch (e) {
    clearTimeout(timeout);
    loadingDiv.remove();
    if (e.name === 'AbortError') {
      appendBotBubble('응답 시간이 초과되었습니다 (15분). 질문을 더 짧게 나눠서 보내주세요.', [], null);
    } else if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
      appendBotBubble('서버에 연결할 수 없습니다. 서버가 실행 중인지 확인해 주세요.', [], null);
    } else {
      appendBotBubble(`오류가 발생했습니다: ${e.message}`, [], null);
    }
  } finally {
    sendBtn.disabled = false;
    queryEl.focus();
  }
}

// ══════════════════════════════════════════════
// Formatting helpers
// ══════════════════════════════════════════════
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function stripLLMSources(text) {
  return text
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/\n*\*{0,2}참고\s*문서\*{0,2}[\s\S]*$/, '')
    .replace(/\n*\*{0,2}출처\*{0,2}[\s\S]*$/, '')
    .trimEnd();
}

function formatAnswer(text) {
  const rawLines = text.split('\n');
  const segments = [];
  let i = 0;
  const isSep = l => /^\|[\s\-:|]+\|/.test(l.trim());

  while (i < rawLines.length) {
    const line = rawLines[i];
    const trimmed = line.trim();
    if (trimmed.startsWith('|') && i + 1 < rawLines.length && isSep(rawLines[i + 1])) {
      const tableRows = [];
      while (i < rawLines.length && rawLines[i].trim().startsWith('|')) {
        tableRows.push(rawLines[i].trim()); i++;
      }
      segments.push({ type: 'table', rows: tableRows });
    } else {
      if (segments.length && segments[segments.length - 1].type === 'text') {
        segments[segments.length - 1].lines.push(line);
      } else {
        segments.push({ type: 'text', lines: [line] });
      }
      i++;
    }
  }

  const parseCells = row => row.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const isSepRow = row => /^\|[\s\-:|]+\|/.test(row);

  return segments.map(seg => {
    if (seg.type === 'table') {
      const rows = seg.rows;
      const ths = parseCells(rows[0]).map(c => `<th>${escHtml(c)}</th>`).join('');
      const trs = rows.slice(2).filter(r => !isSepRow(r)).map(r =>
        `<tr>${parseCells(r).map(c => `<td>${escHtml(c)}</td>`).join('')}</tr>`
      ).join('');
      return `<table class="md-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
    }
    let t = seg.lines.join('\n');
    t = escHtml(t);
    t = t.replace(/&lt;br\s*\/?&gt;/gi, '\n');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\*(.*?)\*/g, '<em>$1</em>');
    t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    t = t.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    t = t.replace(/^(\d+)\.\s+(.+)$/gm, '<li>$2</li>');
    t = t.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ol>${m}</ol>`);
    t = t.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
    t = t.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
    t = t.split(/\n{2,}/).map(p => {
      const pt = p.trim();
      if (!pt) return '';
      if (/^<(h[23]|ol|ul|table)/.test(pt)) return pt;
      return `<p>${pt.replace(/\n/g, '<br>')}</p>`;
    }).join('');
    return t;
  }).join('');
}

// ══════════════════════════════════════════════
// Sidebar toggle / mobile
// ══════════════════════════════════════════════
function closeMobileSidebar() {
  if (window.innerWidth <= 640) {
    sidebarEl.classList.remove('open');
    overlayEl.classList.remove('show');
  }
}

document.getElementById('btn-toggle').addEventListener('click', () => {
  if (window.innerWidth <= 640) {
    sidebarEl.classList.toggle('open');
    overlayEl.classList.toggle('show');
  } else {
    sidebarEl.classList.toggle('collapsed');
  }
});

overlayEl.addEventListener('click', closeMobileSidebar);
document.getElementById('btn-new').addEventListener('click', startNewChat);

// ══════════════════════════════════════════════
// Misc
// ══════════════════════════════════════════════
function fillQuery(btn) {
  queryEl.value = btn.textContent.trim();
  queryEl.focus();
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function autoResize() {
  queryEl.style.height = 'auto';
  queryEl.style.height = Math.min(queryEl.scrollHeight, 120) + 'px';
}

queryEl.addEventListener('input', autoResize);
queryEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault(); sendMessage();
  }
});

// ══════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════
(async function init() {
  await refreshSessions();

  if (currentSessionId) {
    const exists = sidebarSessions.find(s => s.id === currentSessionId);
    if (exists) {
      await selectSession(currentSessionId);
      return;
    }
    currentSessionId = null;
    localStorage.removeItem('canvas-rag-session');
  }
  showWelcome();
})();
</script>
