<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas RAG 챗봇</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --canvas: #E66000;
      --canvas-dark: #C45300;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #dde1e7;
      --text: #1a1a1a;
      --text-muted: #6b7280;
      --user-bg: #E66000;
      --user-text: #ffffff;
      --bot-bg: #ffffff;
      --bot-border: #dde1e7;
      --source-bg: #fff7f0;
      --source-border: #f5d8c0;
      --radius: 12px;
      --radius-sm: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--canvas);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
      flex-shrink: 0;
    }
    header .logo {
      width: 32px; height: 32px;
      background: #fff;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: var(--canvas);
    }
    header h1 { font-size: 17px; font-weight: 600; }
    header .subtitle { font-size: 12px; opacity: .8; margin-top: 1px; }
    header .session-badge {
      margin-left: auto;
      font-size: 11px;
      background: rgba(255,255,255,.2);
      padding: 3px 8px;
      border-radius: 20px;
      opacity: .85;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Controls bar */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .controls label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
    .controls select {
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      background: var(--bg);
      cursor: pointer;
      outline: none;
    }
    .controls select:focus { border-color: var(--canvas); }
    .btn-reset {
      margin-left: auto;
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      color: var(--text-muted);
    }
    .btn-reset:hover { border-color: var(--canvas); color: var(--canvas); }

    /* Chat window */
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; gap: 10px; max-width: 780px; width: 100%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .msg.user .avatar { background: var(--canvas); color: #fff; }
    .msg.bot  .avatar { background: #e8eaf0; color: #555; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      max-width: calc(100% - 44px);
      overflow-x: auto;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--bot-border);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    /* Sources */
    .sources {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--source-bg);
      border: 1px solid var(--source-border);
      border-radius: var(--radius-sm);
      font-size: 12px;
    }
    .sources .src-title {
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: 11px;
    }
    .sources a {
      display: block;
      color: var(--canvas-dark);
      text-decoration: none;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sources a:hover { text-decoration: underline; }
    .sources .score {
      display: inline-block;
      background: #fde8d5;
      color: var(--canvas-dark);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* Loading */
    .loading-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--canvas);
      margin: 0 2px;
      animation: bounce 1.1s infinite ease-in-out;
    }
    .loading-dots span:nth-child(2) { animation-delay: .18s; }
    .loading-dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(.6); opacity: .4; }
      40%           { transform: scale(1);  opacity: 1;  }
    }

    /* Progress status / source chips */
    .progress-status {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .source-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
      min-height: 0;
    }
    .source-chip {
      font-size: 11px;
      padding: 2px 8px;
      background: var(--source-bg);
      border: 1px solid var(--source-border);
      border-radius: 12px;
      color: var(--canvas-dark);
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Answer formatting */
    .bubble p  { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ol, .bubble ul { padding-left: 20px; margin-bottom: 8px; }
    .bubble li { margin-bottom: 4px; }
    .bubble strong { font-weight: 600; }
    .bubble h2 { font-size: 15px; font-weight: 700; margin: 12px 0 6px; }
    .bubble h3 { font-size: 14px; font-weight: 600; margin: 10px 0 4px; }
    /* 스트리밍 중 raw 텍스트 표시 */
    .stream-raw { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 14px; }

    /* Markdown table */
    .bubble .md-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12.5px;
      margin: 10px 0;
      overflow-x: auto;
      display: block;
    }
    .bubble .md-table th,
    .bubble .md-table td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble .md-table th {
      background: var(--bg);
      font-weight: 600;
      white-space: nowrap;
    }
    .bubble .md-table tr:nth-child(even) td { background: #fafbfc; }
    .bubble .md-table td:nth-child(3) { white-space: pre-wrap; font-size: 13px; }

    /* Input area */
    .input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    #query {
      flex: 1;
      font-size: 14px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      font-family: inherit;
    }
    #query:focus { border-color: var(--canvas); }
    #send {
      background: var(--canvas);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    #send:hover { background: var(--canvas-dark); }
    #send:disabled { opacity: .5; cursor: not-allowed; }

    /* Welcome message */
    .welcome {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
      max-width: 480px;
      margin: auto;
    }
    .welcome .icon { font-size: 48px; margin-bottom: 12px; }
    .welcome h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .welcome p { font-size: 13px; line-height: 1.6; }
    .welcome .examples {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .example-btn {
      font-size: 13px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: left;
      color: var(--text);
      transition: border-color .15s;
    }
    .example-btn:hover { border-color: var(--canvas); color: var(--canvas); }

    @media (max-width: 600px) {
      header h1 { font-size: 15px; }
      .bubble { font-size: 13px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">C</div>
  <div>
    <h1>Canvas RAG 챗봇</h1>
    <div class="subtitle">Canvas LMS 공식 문서 기반 AI 답변</div>
  </div>
  <div class="session-badge" id="session-badge">새 대화</div>
</header>

<div class="controls">
  <label for="role">역할</label>
  <select id="role">
    <option value="">전체</option>
    <option value="student">학생 (Student)</option>
    <option value="instructor">교수자 (Instructor)</option>
    <option value="admin">관리자 (Admin)</option>
  </select>
  <button class="btn-reset" id="btn-reset">대화 초기화</button>
</div>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="icon">📚</div>
    <h2>Canvas 가이드 AI 챗봇</h2>
    <p>Canvas LMS 공식 문서를 기반으로 한국어로 답변합니다.<br>출처 URL이 함께 제공됩니다.</p>
    <div class="examples">
      <button class="example-btn" onclick="fillQuery(this)">Canvas에서 assignment를 어떻게 제출하나요?</button>
      <button class="example-btn" onclick="fillQuery(this)">due date와 availability date 차이가 뭔가요?</button>
      <button class="example-btn" onclick="fillQuery(this)">SpeedGrader 사용 방법을 알려주세요.</button>
      <button class="example-btn" onclick="fillQuery(this)">Canvas Gradebook에서 성적을 입력하는 방법은?</button>
    </div>
  </div>
</div>

<div class="input-area">
  <textarea id="query" placeholder="Canvas 관련 질문을 입력하세요..." rows="1"></textarea>
  <button id="send" onclick="sendMessage()">전송</button>
</div>

<script>
  const STORAGE_KEY = 'canvas-rag-history';
  const SESSION_KEY = 'canvas-rag-session';

  let sessionId = localStorage.getItem(SESSION_KEY) || null;
  let messageHistory = [];  // [{role:'user'|'bot', text, sources}]

  const messagesEl = document.getElementById('messages');
  const queryEl    = document.getElementById('query');
  const sendBtn    = document.getElementById('send');
  const badgeEl    = document.getElementById('session-badge');
  const welcomeEl  = document.getElementById('welcome');

  function saveHistory() {
    try {
      const json = JSON.stringify(messageHistory);
      localStorage.setItem(STORAGE_KEY, json);
      console.log('[canvas-rag] saved', messageHistory.length, 'messages');
    } catch (e) {
      console.error('[canvas-rag] saveHistory 실패:', e);
    }
  }

  function renderUserMsg(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="avatar">나</div><div class="bubble">${escHtml(text)}</div>`;
    messagesEl.appendChild(div);
  }

  function renderBotMsg(answer, sources) {
    const div = document.createElement('div');
    div.className = 'msg bot';
    let sourcesHtml = '';
    if (sources && sources.length > 0) {
      const links = sources.map(s => {
        const title = escHtml(s.title || s.source_url);
        const score = s.score ? `<span class="score">${(s.score * 100).toFixed(0)}%</span>` : '';
        return `<a href="${escHtml(s.source_url)}" target="_blank" rel="noopener">${title}${score}</a>`;
      }).join('');
      sourcesHtml = `<div class="sources"><div class="src-title">참고 문서</div>${links}</div>`;
    }
    div.innerHTML = `<div class="avatar">AI</div><div class="bubble">${formatAnswer(answer)}${sourcesHtml}</div>`;
    messagesEl.appendChild(div);
  }

  function loadHistory() {
    console.log('[canvas-rag] loadHistory 시작');
    let saved;
    try {
      saved = localStorage.getItem(STORAGE_KEY);
    } catch (e) { console.error('[canvas-rag] localStorage 읽기 실패:', e); return; }
    console.log('[canvas-rag] localStorage 원시값:', saved ? saved.slice(0, 80) + '…' : saved);
    if (!saved) return;

    try {
      messageHistory = JSON.parse(saved);
    } catch {
      localStorage.removeItem(STORAGE_KEY);
      return;
    }
    if (!Array.isArray(messageHistory) || messageHistory.length === 0) return;

    welcomeEl?.remove();
    let renderOk = true;
    messageHistory.forEach(m => {
      try {
        if (m.role === 'user') renderUserMsg(m.text || '');
        else renderBotMsg(m.text || '', m.sources || []);
      } catch (e) {
        renderOk = false;
        console.error('loadHistory render error:', e, m);
      }
    });
    scrollBottom();
    if (sessionId) badgeEl.textContent = '세션 ' + sessionId.slice(0, 8) + '…';
    if (!renderOk) console.warn('일부 메시지 렌더링 실패 — 브라우저 콘솔을 확인해주세요.');
  }

  function fillQuery(btn) {
    queryEl.value = btn.textContent.trim();
    queryEl.focus();
  }

  function hideWelcome() {
    document.getElementById('welcome')?.remove();
  }

  function appendUserMsg(text) {
    hideWelcome();
    renderUserMsg(text);
    messageHistory.push({ role: 'user', text, sources: [] });
    saveHistory();
    scrollBottom();
  }

  function appendBotMsg(answer, sources) {
    renderBotMsg(answer, sources);
    messageHistory.push({ role: 'bot', text: answer, sources: sources || [] });
    saveHistory();
    scrollBottom();
  }

  function appendLoading() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'loading-msg';
    div.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble">
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>`;
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function removeLoading() {
    document.getElementById('loading-msg')?.remove();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // LLM이 생성한 <br> 태그를 줄바꿈으로 변환, "참고 문서"/"출처" 블록 제거
  function stripLLMSources(text) {
    return text
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/\n*\*{0,2}참고\s*문서\*{0,2}[\s\S]*$/, '')
      .replace(/\n*\*{0,2}출처\*{0,2}[\s\S]*$/, '')
      .trimEnd();
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatAnswer(text) {
    // 1단계: 라인별로 분리해서 Markdown 테이블을 HTML 테이블로 변환
    const rawLines = text.split('\n');
    const segments = []; // {type: 'text'|'table', content: string|string[]}
    let i = 0;

    while (i < rawLines.length) {
      const line = rawLines[i];
      const trimmed = line.trim();
      // 테이블 헤더: |로 시작하고 끝나며, 다음 줄이 구분자(|---|)인 경우
      const isSep = l => /^\|[\s\-:|]+\|/.test(l.trim());
      if (trimmed.startsWith('|') && i + 1 < rawLines.length && isSep(rawLines[i + 1])) {
        const tableRows = [];
        while (i < rawLines.length && rawLines[i].trim().startsWith('|')) {
          tableRows.push(rawLines[i].trim());
          i++;
        }
        segments.push({ type: 'table', rows: tableRows });
      } else {
        if (segments.length && segments[segments.length - 1].type === 'text') {
          segments[segments.length - 1].lines.push(line);
        } else {
          segments.push({ type: 'text', lines: [line] });
        }
        i++;
      }
    }

    // 2단계: 각 segment를 HTML로 변환
    const parseCells = row => row.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    const isSepRow = row => /^\|[\s\-:|]+\|/.test(row);

    let html = segments.map(seg => {
      if (seg.type === 'table') {
        const rows = seg.rows;
        const headerRow = rows[0];
        const bodyRows = rows.slice(2).filter(r => !isSepRow(r));
        const ths = parseCells(headerRow).map(c => `<th>${escHtml(c)}</th>`).join('');
        const trs = bodyRows.map(r => {
          const tds = parseCells(r).map(c => `<td>${escHtml(c)}</td>`).join('');
          return `<tr>${tds}</tr>`;
        }).join('');
        return `<table class="md-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
      } else {
        // 일반 텍스트 처리
        let t = seg.lines.join('\n');
        t = escHtml(t);
        // LLM이 생성한 <br> 태그를 실제 줄바꿈으로 복원
        t = t.replace(/&lt;br\s*\/?&gt;/gi, '\n');
        t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/\*(.*?)\*/g, '<em>$1</em>');
        t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        t = t.replace(/^## (.+)$/gm, '<h2>$1</h2>');
        // 번호 목록
        t = t.replace(/^(\d+)\.\s+(.+)$/gm, '<li>$2</li>');
        t = t.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ol>${m}</ol>`);
        // 불릿 목록
        t = t.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
        t = t.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
        // 단락 분리
        t = t.split(/\n{2,}/).map(p => {
          const pt = p.trim();
          if (!pt) return '';
          if (/^<(h[23]|ol|ul)/.test(pt)) return pt;
          return `<p>${pt.replace(/\n/g, '<br>')}</p>`;
        }).join('');
        return t;
      }
    }).join('');

    return html;
  }

  async function sendMessage() {
    const query = queryEl.value.trim();
    if (!query) return;

    const role = document.getElementById('role').value || null;
    queryEl.value = '';
    autoResize();
    sendBtn.disabled = true;

    appendUserMsg(query);

    // 로딩 버블 — 내부 요소는 ID 없이 생성하고 참조를 클로저로 캡처
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'msg bot';
    loadingDiv.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble">
        <div class="progress-status">질문을 분석하고 있습니다...</div>
        <div class="source-chips"></div>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>`;
    messagesEl.appendChild(loadingDiv);
    scrollBottom();

    // 이 요청 전용 참조 — document.getElementById 재사용 금지
    const bubbleEl   = loadingDiv.querySelector('.bubble');
    const progressEl = loadingDiv.querySelector('.progress-status');
    const chipsEl    = loadingDiv.querySelector('.source-chips');
    let streamRawEl  = null;

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 900_000);

    try {
      const res = await fetch('/chat/stream', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ query, role, session_id: sessionId, top_k: 15 }),
        signal: controller.signal,
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const detail = Array.isArray(err.detail)
          ? err.detail.map(d => d.msg || JSON.stringify(d)).join(', ')
          : (typeof err.detail === 'string' ? err.detail : `HTTP ${res.status}`);
        throw new Error(detail);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let answerText = '';
      let streamingStarted = false;
      let generatingTimer = null;

      const WAIT_MESSAGES = [
        '답변 생성 중입니다. 조금만 기다려 주세요...',
        '예상보다 조금 오래 걸리고 있습니다...',
        '복잡한 질문입니다. 거의 다 됐습니다...',
        '잠시만 더 기다려 주세요...',
      ];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let event;
          try { event = JSON.parse(line.slice(6)); } catch { continue; }

          if (event.type === 'status') {
            if (progressEl) progressEl.textContent = event.message;
            if (event.message.includes('답변을 생성')) {
              let idx = 0;
              generatingTimer = setInterval(() => {
                if (progressEl && idx < WAIT_MESSAGES.length)
                  progressEl.textContent = WAIT_MESSAGES[idx++];
              }, 15000);
            }

          } else if (event.type === 'source_found') {
            if (chipsEl) {
              const chip = document.createElement('span');
              chip.className = 'source-chip';
              chip.title = event.title;
              chip.textContent = event.title;
              chipsEl.appendChild(chip);
              scrollBottom();
            }

          } else if (event.type === 'token') {
            if (!streamingStarted) {
              if (generatingTimer) { clearInterval(generatingTimer); generatingTimer = null; }
              if (bubbleEl) {
                bubbleEl.innerHTML = '<div class="stream-raw"></div>';
                streamRawEl = bubbleEl.querySelector('.stream-raw');
              }
              streamingStarted = true;
            }
            answerText += event.content;
            if (streamRawEl) {
              // <br> 태그를 스트리밍 중에도 줄바꿈으로 변환
              const displayText = event.content.replace(/<br\s*\/?>/gi, '\n');
              streamRawEl.insertAdjacentText('beforeend', displayText);
              scrollBottom();
            }

          } else if (event.type === 'done') {
            clearTimeout(timer);
            if (generatingTimer) { clearInterval(generatingTimer); generatingTimer = null; }
            sessionId = event.session_id || sessionId;
            if (sessionId) {
              badgeEl.textContent = '세션 ' + sessionId.slice(0, 8) + '…';
              localStorage.setItem(SESSION_KEY, sessionId);
            }

            if (bubbleEl) {
              const finalAnswer = stripLLMSources(answerText || event.answer || '');
              const finalSources = event.sources || [];
              // 저장을 렌더링 전에 먼저 — formatAnswer 예외 발생 시에도 보존
              messageHistory.push({ role: 'bot', text: finalAnswer, sources: finalSources });
              saveHistory();
              let sourcesHtml = '';
              if (finalSources.length > 0) {
                const links = finalSources.map(s => {
                  const title = escHtml(s.title || s.source_url);
                  const score = s.score ? `<span class="score">${(s.score*100).toFixed(0)}%</span>` : '';
                  return `<a href="${escHtml(s.source_url)}" target="_blank" rel="noopener">${title}${score}</a>`;
                }).join('');
                sourcesHtml = `<div class="sources"><div class="src-title">참고 문서</div>${links}</div>`;
              }
              try {
                bubbleEl.innerHTML = formatAnswer(finalAnswer) + sourcesHtml;
              } catch (e) {
                bubbleEl.innerHTML = `<pre style="white-space:pre-wrap;word-break:break-word">${escHtml(finalAnswer)}</pre>${sourcesHtml}`;
              }
              scrollBottom();
            }
          }
        }
      }

    } catch (e) {
      clearTimeout(timer);
      loadingDiv.remove();
      if (e.name === 'AbortError') {
        appendBotMsg('응답 시간이 초과되었습니다 (15분). 질문을 더 짧게 나눠서 보내주세요.', []);
      } else if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
        appendBotMsg('서버에 연결할 수 없습니다. 서버가 실행 중인지 확인해 주세요.', []);
      } else {
        appendBotMsg(`오류가 발생했습니다: ${e.message}`, []);
      }
    } finally {
      sendBtn.disabled = false;
      queryEl.focus();
    }
  }

  async function resetSession() {
    if (sessionId) {
      try { await fetch(`/chat/session/${sessionId}`, { method: 'DELETE' }); } catch {}
    }
    sessionId = null;
    messageHistory = [];
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(SESSION_KEY);
    badgeEl.textContent = '새 대화';
    messagesEl.innerHTML = '';
    messagesEl.insertAdjacentHTML('afterbegin', `
      <div class="welcome" id="welcome">
        <div class="icon">📚</div>
        <h2>Canvas 가이드 AI 챗봇</h2>
        <p>Canvas LMS 공식 문서를 기반으로 한국어로 답변합니다.<br>출처 URL이 함께 제공됩니다.</p>
        <div class="examples">
          <button class="example-btn" onclick="fillQuery(this)">Canvas에서 assignment를 어떻게 제출하나요?</button>
          <button class="example-btn" onclick="fillQuery(this)">due date와 availability date 차이가 뭔가요?</button>
          <button class="example-btn" onclick="fillQuery(this)">SpeedGrader 사용 방법을 알려주세요.</button>
          <button class="example-btn" onclick="fillQuery(this)">Canvas Gradebook에서 성적을 입력하는 방법은?</button>
        </div>
      </div>`);
  }

  document.getElementById('btn-reset').addEventListener('click', resetSession);

  // 페이지 로드 시 이전 대화 복원
  loadHistory();

  // Enter to send (Shift+Enter for newline)
  queryEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  function autoResize() {
    queryEl.style.height = 'auto';
    queryEl.style.height = Math.min(queryEl.scrollHeight, 120) + 'px';
  }
  queryEl.addEventListener('input', autoResize);
</script>
