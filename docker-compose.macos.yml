services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: canvas-rag-qdrant
    ports:
      - "6333:6333"   # REST / OpenAPI
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
