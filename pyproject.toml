[project]
name = "canvas-rag-chatbot"
version = "0.1.0"
description = "Canvas Guides RAG Chatbot – internal use"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "lxml>=5.2.0",
    "tenacity>=8.3.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "markdownify>=0.13.0",
    "qdrant-client>=1.9.0",
    "openai>=1.50.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "tavily-python>=0.7.24",
    "playwright>=1.59.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
]
# Heavy ML deps – install separately on M3 Pro:
#   uv sync --group embedding
embedding = [
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
